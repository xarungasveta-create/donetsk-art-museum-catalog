<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#22201e"><title>Живопис. Акварель — Донецький обласний художній музей</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#201f20;color:#f5f1ec;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.app{min-height:100vh;display:flex;flex-direction:column}.header{text-align:center;padding:16px 12px 9px}.header small{display:block;color:#d2c8bd;font-size:12px;letter-spacing:.06em}.header h1{font-size:clamp(17px,3vw,25px);font-weight:600;margin:7px 0 2px}.header p{margin:0;font-size:13px;color:#c9c3bd}.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 48px 18px;min-height:0;position:relative}.book{position:relative;display:flex;align-items:center;justify-content:center;perspective:1800px;max-width:100%;height:min(72vh,760px);width:100%;cursor:pointer}.page{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 12px 36px #0009;background:#fff;transition:transform .34s ease,opacity .34s ease;transform-origin:center;user-select:none}.page.flip-next{transform:rotateY(-25deg) scale(.97);opacity:.2}.page.flip-prev{transform:rotateY(25deg) scale(.97);opacity:.2}.nav{position:absolute;top:50%;transform:translateY(-50%);border:1px solid #ffffff44;background:#3d3937;color:white;border-radius:50%;width:44px;height:44px;font-size:27px;cursor:pointer;display:grid;place-items:center}.nav:disabled{opacity:.25;cursor:default}.nav.prev{left:4px}.nav.next{right:4px}.controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:10px 12px 20px}.controls button{border:1px solid #ffffff55;background:#383533;color:#fff;border-radius:7px;padding:9px 14px;cursor:pointer;font-size:14px}.controls button:hover,.nav:hover:not(:disabled){background:#5a514c}.counter{min-width:160px;text-align:center;font-size:13px;color:#ddd}.hint{text-align:center;color:#bdb6af;font-size:12px;padding:0 12px 14px}.zoom{display:none;position:fixed;inset:0;background:#000e;z-index:5;overflow:auto;padding:55px 12px 30px;text-align:center}.zoom.open{display:block}.zoom img{width:auto;max-width:none;max-height:none;min-width:80vw}.zoom button{position:fixed;right:15px;top:12px;background:#fff;color:#111;border:0;border-radius:7px;padding:10px 16px;cursor:pointer}.loading{color:#ccc;position:absolute;z-index:-1}@media(max-width:650px){.header{padding-top:14px}.header p{font-size:12px}.stage{padding:6px 36px 8px}.book{height:min(66vh,680px)}.nav{width:33px;height:40px;font-size:23px}.nav.prev{left:1px}.nav.next{right:1px}.controls{gap:7px}.counter{min-width:135px}.controls button{padding:8px 10px}}
</style></head><body><main class="app"><header class="header"><small>ДОНЕЦЬКИЙ ОБЛАСНИЙ ХУДОЖНІЙ МУЗЕЙ</small><h1>Живопис. Акварель</h1><p>Каталог творів із колекції музею · Чернівці, 2025</p></header><section class="stage"><button class="nav prev" id="prev" aria-label="Попередня сторінка">‹</button><div class="book" id="book" title="Натисніть, щоб перейти до наступного розвороту"><span class="loading">Завантаження…</span><img class="page" id="page" src="images/page_01.jpg" alt="Титульна сторінка каталогу" draggable="false"></div><button class="nav next" id="next" aria-label="Наступна сторінка">›</button></section><div class="controls"><button id="first">На початок</button><span class="counter" id="counter" aria-live="polite"></span><button id="zoomBtn">Збільшити</button><button id="last">У кінець</button></div><p class="hint">Перегортайте стрілками або клавішами ← →. Кнопка «Збільшити» відкриває сторінку для детального перегляду.</p></main><div class="zoom" id="zoom" role="dialog" aria-label="Збільшене зображення"><button id="closeZoom">Закрити ✕</button><img id="zoomImage" alt="Збільшений розворот каталогу"></div><script>
const total=35;let current=1,busy=false;const page=document.getElementById('page'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next'),zoom=document.getElementById('zoom');const path=n=>n===1?"images/cover_front.jpg":n===35?"images/cover_back.jpg":`images/page_${String(n-1).padStart(2,"0")}.jpg`;
function render(){page.src=path(current);page.alt=current===1?'Титульна сторінка каталогу':`Розворот каталогу ${current-1}`;counter.textContent=current===1?'Титульна сторінка':`Розворот ${current-1} із ${total-1}`;prev.disabled=current===1;next.disabled=current===total;document.getElementById('zoomImage').src=path(current);for(let n of [current+1,current-1])if(n>0&&n<=total){let im=new Image();im.src=path(n)}}
function go(n){if(busy||n<1||n>total||n===current)return;busy=true;page.classList.add(n>current?'flip-next':'flip-prev');setTimeout(()=>{current=n;render();page.classList.remove('flip-next','flip-prev');setTimeout(()=>busy=false,350)},290)}
prev.onclick=()=>go(current-1);next.onclick=()=>go(current+1);document.getElementById('first').onclick=()=>go(1);document.getElementById('last').onclick=()=>go(total);document.getElementById('book').onclick=()=>go(current+1);document.getElementById('zoomBtn').onclick=()=>{zoom.classList.add('open');document.body.style.overflow='hidden'};function closeZoom(){zoom.classList.remove('open');document.body.style.overflow=''}document.getElementById('closeZoom').onclick=closeZoom;zoom.onclick=e=>{if(e.target===zoom)closeZoom()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeZoom();if(!zoom.classList.contains('open')){if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)}});let sx=0;document.getElementById('book').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});document.getElementById('book').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>65)go(current+(d<0?1:-1))},{passive:true});render();
</script></body></html>
